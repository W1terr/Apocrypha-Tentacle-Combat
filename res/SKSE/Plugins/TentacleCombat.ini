; Apocrypha Tentacle Combat
; Distances are game units for a tentacle at scale 1 (bigger tentacles reach farther).

[Tentacles]
; a tentacle rises when you come this close
fEngageDistance = 430
; ... and sinks back only when you are farther away than this (for 1.5 s)
fRetreatDistance = 750
; how far (degrees, each side) it can turn away from where it was placed to follow you; 180 = all the way around
; (with less, it only rises for you in front of it)
fTurnLimit = 180
; seconds it sways between two strikes (random in between)
fStrikePauseMin = 0.5
fStrikePauseMax = 1.5
; times the vanilla trap damage (100 at level 30 and below ... 350 above level 62)
fDamageMult = 1.0
; one hit takes at most this much (percent) of your max health, after your armor, blocking and the difficulty;
; 0 = no cap (the vanilla damage as it is)
fMaxHitPercent = 35
; the vanilla trap's 2.5% disease chance on a hit
bDisease = 1

[Debug]
; log every state change of every tentacle
bVerboseLog = 0
